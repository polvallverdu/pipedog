<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice bot</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Voice bot</h1>
    <p id="status">Disconnected</p>
    <button id="connect" type="button">Connect</button>

    <script type="module">
      import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js@1.13.1";
      import { SmallWebRTCTransport } from "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.10.8";

      const status = document.querySelector("#status");
      const button = document.querySelector("#connect");

      const client = new PipecatClient({
        transport: new SmallWebRTCTransport({ webrtcRequestParams: { endpoint: "/api/offer" } }),
        enableMic: true,
        callbacks: {
          onConnected: () => {
            status.textContent = "Connected: say something";
            button.textContent = "Disconnect";
          },
          onDisconnected: () => {
            status.textContent = "Disconnected";
            button.textContent = "Connect";
          },
          onError: (error) => {
            status.textContent = `Error: ${error?.message ?? error}`;
          },
        },
      });

      button.addEventListener("click", async () => {
        if (button.textContent === "Connect") {
          status.textContent = "Connecting...";
          await client.connect();
        } else {
          await client.disconnect();
        }
      });
    </script>
  </body>
</html>
