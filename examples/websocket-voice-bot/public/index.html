<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice bot</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
      }
      #transcript p {
        margin: 0.5rem 0;
      }
      #transcript .user::before {
        content: "You: ";
        font-weight: bold;
      }
      #transcript .bot::before {
        content: "Bot: ";
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Voice bot</h1>
    <p id="status">Disconnected</p>
    <button id="connect" type="button">Connect</button>
    <div id="transcript"></div>

    <script type="module">
      import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js@1.13.1";
      import {
        ProtobufFrameSerializer,
        WavMediaManager,
        WebSocketTransport,
      } from "https://esm.sh/@pipecat-ai/websocket-transport@1.7.2";

      const status = document.querySelector("#status");
      const button = document.querySelector("#connect");
      const transcript = document.querySelector("#transcript");

      // The bot's reply arrives a sentence at a time; this is the line it goes on.
      let botLine = null;
      // Each sentence is reported when it is generated and again once spoken.
      const shownSegments = new Set();
      function addLine(role, text) {
        const line = document.createElement("p");
        line.className = role;
        line.textContent = text;
        transcript.append(line);
        return line;
      }

      const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
      const client = new PipecatClient({
        transport: new WebSocketTransport({
          wsUrl,
          // Pipecat's protobuf frames, the format the bot's serializer speaks.
          serializer: new ProtobufFrameSerializer(),
          // The microphone is recorded at 16 kHz in chunks of 512 samples, and the
          // bot's 24 kHz speech is played with Web Audio. (The default media
          // manager does the same through Daily's call engine, which it
          // downloads from Daily's CDN.)
          mediaManager: new WavMediaManager(512, 16000),
        }),
        enableMic: true,
        callbacks: {
          onConnected: () => {
            status.textContent = "Connected: say something";
            button.textContent = "Disconnect";
          },
          onDisconnected: () => {
            status.textContent = "Disconnected";
            button.textContent = "Connect";
          },
          onUserTranscript: (data) => {
            if (!data.final) return;
            addLine("user", data.text);
            botLine = null;
          },
          onBotOutput: (data) => {
            if (data.aggregated_by === "word") return;
            if (data.segment_id !== undefined) {
              if (shownSegments.has(data.segment_id)) return;
              shownSegments.add(data.segment_id);
            }
            botLine ??= addLine("bot", "");
            botLine.textContent = `${botLine.textContent} ${data.text}`.trim();
          },
          onBotStoppedSpeaking: () => {
            botLine = null;
          },
          onError: (error) => {
            status.textContent = `Error: ${error?.message ?? error}`;
          },
        },
      });

      button.addEventListener("click", async () => {
        if (button.textContent === "Connect") {
          status.textContent = "Connecting...";
          await client.connect();
        } else {
          await client.disconnect();
        }
      });
    </script>
  </body>
</html>
