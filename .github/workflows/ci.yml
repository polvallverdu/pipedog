name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - name: Typecheck the landing demo's SvelteKit page (svelte-check)
        run: bun run --cwd examples/landing-demo/web check
      - run: bun run lint
      - name: Changeset present
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: bunx changeset status --since=origin/main || echo "::warning::No changeset in this PR. Add one with 'bun changeset' if it changes a published package."

  # Every test file in a few shards, balanced by .github/test-timings.json. Each shard runs its
  # files in parallel worker processes, each file isolated (fresh globals and modules), so files
  # can't leak into each other. Refresh the timings from a CI run with `bun tools/ci/timings.ts`.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Chromium for the browser tests
        run: bunx playwright-core install --with-deps chromium
      # The local-model packages run one real inference each (e2e_*.test.ts), downloading a small
      # model on first use. Cache the downloads so later runs don't fetch them again; a shard
      # whose files changed starts from another shard's cache. Set the PIPEDOG_E2E repository
      # variable to 0 to skip those tests.
      - name: Model cache for the local-model e2e tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/pipedog
          key: pipedog-models-shard${{ matrix.shard }}-${{ hashFiles('.github/test-timings.json') }}
          restore-keys: |
            pipedog-models-shard${{ matrix.shard }}-
            pipedog-models-
      # Balanced by the committed timings; the shard also measures its own files into a copy,
      # uploaded so `bun tools/ci/timings.ts <run id>` can refresh the committed file from CI.
      - run: |
          cp .github/test-timings.json "$RUNNER_TEMP/timings.json"
          bun test --parallel --shard=${{ matrix.shard }}/4 --timings="$RUNNER_TEMP/timings.json" --update-timings
        env:
          PIPEDOG_E2E: ${{ vars.PIPEDOG_E2E || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          retention-days: 7

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Runtime compatibility (bun, node, deno, workerd)
        run: bun tools/compat/run.ts

  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Release rehearsal (pack, install from tarballs, import everything from Node)
        run: bun run release:verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run docs:build

  # The "Protect main" ruleset requires a check named `test`. This job stands in
  # for the test shards and every other job: it passes only if all of them did.
  test:
    needs: [checks, tests, compat, release-verify, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          for result in \
            "${{ needs.checks.result }}" \
            "${{ needs.tests.result }}" \
            "${{ needs.compat.result }}" \
            "${{ needs.release-verify.result }}" \
            "${{ needs.docs.result }}"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
