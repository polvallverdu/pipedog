name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - name: Changeset present
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: bunx changeset status --since=origin/main || echo "::warning::No changeset in this PR. Add one with 'bun changeset' if it changes a published package."

  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Packages with tests
        run: |
          dirs=()
          for dir in packages/*/ examples/*/; do
            if find "${dir}test" -name '*.test.ts' 2>/dev/null | grep -q .; then
              dirs+=("${dir%/}")
            fi
          done
          printf 'packages=%s\n' "$(printf '%s\n' "${dirs[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  packages:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    name: test (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Chromium for the browser tests
        if: matrix.package == 'examples/smallwebrtc-voice-bot'
        working-directory: ${{ matrix.package }}
        run: bunx playwright-core install --with-deps chromium
      - run: bun test ${{ matrix.package }}

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Runtime compatibility (bun, node, deno, workerd)
        run: bun tools/compat/run.ts

  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Release rehearsal (pack, install from tarballs, import everything from Node)
        run: bun run release:verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run docs:build

  # The "Protect main" ruleset requires a check named `test`. This job stands in
  # for the per-package matrix and every other job: it passes only if all of them did.
  test:
    needs: [plan, checks, packages, compat, release-verify, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          for result in \
            "${{ needs.plan.result }}" \
            "${{ needs.checks.result }}" \
            "${{ needs.packages.result }}" \
            "${{ needs.compat.result }}" \
            "${{ needs.release-verify.result }}" \
            "${{ needs.docs.result }}"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
