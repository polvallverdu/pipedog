name: Setup
description: Install Bun, Node, Deno and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - run: bun install --frozen-lockfile
      shell: bash
