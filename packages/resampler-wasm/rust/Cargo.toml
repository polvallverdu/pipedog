[package]
name = "pipecat-resampler-wasm"
version = "0.0.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false
description = "rubato sinc resampler behind a tiny C ABI, built for wasm32-unknown-unknown."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# MIT OR Apache-2.0. The FFT resampler (realfft) is not needed: default features off.
rubato = { version = "=5.0.1", default-features = false }
audioadapter-buffers = "5.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
